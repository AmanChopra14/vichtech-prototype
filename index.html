<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>VIChTech Wallet Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout concept: use-case index (left) | phone prototype (centre) | live state machine + prototype controls (right) */
:root{
  --bg:#EDF0F6; --panel:#FFFFFF; --ink:#14213D; --muted:#5A6684; --line:#D8DEEA;
  --brand:#1F3864; --onbrand:#FFFFFF; --blue:#2F5FA8; --tint:#E7EEF9;
  --ok:#17795E; --okbg:#DCF2E9; --warn:#8F5A00; --warnbg:#FBEFD3; --bad:#B3261E; --badbg:#FBE2E0;
  --bezel:#101828; --screen:#F6F8FC; --card:#FFFFFF;
  --fd:'Sora',system-ui,sans-serif; --fb:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --panel:#151E35; --ink:#E5EAF6; --muted:#9AA7C4; --line:#27345A;
  --brand:#8FB0EA; --onbrand:#0D1322; --blue:#86AAE8; --tint:#1C2A4B;
  --ok:#4CC9A0; --okbg:#10362D; --warn:#F2B84B; --warnbg:#3A2D10; --bad:#FF8F86; --badbg:#401D1B;
  --bezel:#050810; --screen:#0F172B; --card:#18223D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --panel:#151E35; --ink:#E5EAF6; --muted:#9AA7C4; --line:#27345A;
  --brand:#8FB0EA; --onbrand:#0D1322; --blue:#86AAE8; --tint:#1C2A4B;
  --ok:#4CC9A0; --okbg:#10362D; --warn:#F2B84B; --warnbg:#3A2D10; --bad:#FF8F86; --badbg:#401D1B;
  --bezel:#050810; --screen:#0F172B; --card:#18223D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:var(--fd);margin:0}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:270px 410px 1fr;gap:22px;align-items:start}
@media(max-width:1060px){.shell{grid-template-columns:1fr;justify-items:center}.side{width:100%;max-width:410px}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.side h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-family:var(--fd);font-weight:700}
.brandrow b{font-family:var(--fd);font-size:15px}.brandrow small{display:block;color:var(--muted);font-size:11.5px}
.actor{margin:12px 0 4px;font-weight:700;font-size:12px;color:var(--blue)}
.uc{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;font-size:13px}
.uc:hover{background:var(--tint)}.uc.cur{background:var(--tint);font-weight:700;outline:1.5px solid var(--blue)}
.uc i{font-style:normal;color:var(--muted);font-size:11px;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.rightcol{display:grid;gap:16px;min-width:0;width:100%}
.sm{display:grid;gap:5px}
.st{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;background:var(--screen)}
.st b{display:block;font-size:13px}.st span{color:var(--muted);font-size:11.5px}
.st.on{border-color:var(--blue);background:var(--tint);box-shadow:0 0 0 2px var(--blue)}
.st.fail.on{border-color:var(--bad);background:var(--badbg);box-shadow:0 0 0 2px var(--bad)}
.st.good.on{border-color:var(--ok);background:var(--okbg);box-shadow:0 0 0 2px var(--ok)}
.comp{border:1.5px dashed var(--blue);border-radius:12px;padding:8px;display:grid;gap:5px}
.comp>em{font-style:normal;font-weight:700;font-size:11.5px;color:var(--blue)}
.ctl{display:grid;gap:8px}.ctl label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.ctl select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--screen);color:var(--ink)}
/* phone */
.phonewrap{width:100%;max-width:410px}
#phone{width:100%;max-width:410px;height:820px;background:var(--bezel);border-radius:42px;padding:10px;position:relative}
#app{height:100%;background:var(--screen);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:12px;font-weight:700}
.hdr{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.hdr h1{font-size:17px;flex:1}
.back{background:var(--tint);border:0;border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.chipst{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--tint);color:var(--blue);white-space:nowrap}
#body{flex:1;overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
.tabs button{flex:1;background:none;border:0;padding:9px 0 12px;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabs button.on{color:var(--blue);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.wallet{background:linear-gradient(135deg,var(--brand),#2F5FA8);color:#fff;border:0}
:root[data-theme="dark"] .wallet,:root:not([data-theme="light"]) .wallet{color:#fff}
.wallet small{opacity:.8}.bal{font-family:var(--fd);font-size:30px;font-weight:600;margin:2px 0}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--brand);color:var(--onbrand);width:100%}
.btn.sec{background:var(--tint);color:var(--blue)}.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:grid;gap:6px;font-weight:600}
.act svg{color:var(--blue)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}.row .grow{flex:1;min-width:0}.row b{display:block}.row small{color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.amt{font-family:var(--fd);font-weight:600;white-space:nowrap}.amt.in{color:var(--ok)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--tint);color:var(--blue)}
label.f{display:grid;gap:4px;font-weight:600;font-size:13px}
.f input,.f select,.f textarea{font:inherit;font-weight:400;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}.ferr{color:var(--bad);font-weight:500;font-size:12px}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px}
.b-bad{background:var(--badbg);color:var(--bad)}.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--tint);color:var(--blue)}
.center{text-align:center;display:grid;justify-items:center;gap:8px;padding:10px 0}
.big{width:68px;height:68px;border-radius:50%;display:grid;place-items:center}
.spin{width:44px;height:44px;border:4px solid var(--tint);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue)}.dots i.on{background:var(--blue)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 0;font-family:var(--fd);font-size:20px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}.kv span{color:var(--muted)}.kv b{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:12.5px}.chips button.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.up{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;background:var(--card);width:100%;display:grid;gap:4px;justify-items:center}
.up.done{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.steps{display:grid;gap:8px}.steps div{display:flex;gap:8px;align-items:center}.steps .d{width:20px;height:20px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:11px;color:var(--blue);font-weight:700;flex:none}.steps .d.ok{background:var(--ok);color:#fff}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:13px;z-index:5;box-shadow:0 6px 20px #0004}
.sel{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:8px 0}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}.cb.on{background:var(--blue);border-color:var(--blue)}
.mut{color:var(--muted)}.small{font-size:12px}
.score{font-family:var(--fd);font-size:44px;font-weight:600;color:var(--blue)}
.bar{height:8px;border-radius:99px;background:var(--tint);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}.toggle.on{background:var(--ok)}.toggle.on::after{left:21px}
</style>

<div class="shell">
  <aside class="side" id="index"></aside>
  <div class="phonewrap"><div id="phone"><div id="app"></div></div></div>
  <div class="rightcol">
    <section class="side" id="sm"></section>
    <section class="side" id="ctl" hidden style="display:none"></section>
  </div>
</div>

<script>
/* ---------- data & state ---------- */

];
const SCREEN_UC={login:'Log In',register1:'Register Account',register2:'Register Account',kyc:'Verify identity (KYC)',kycdone:'Verify identity (KYC)',activate:'Activate wallet',
 dashboard:'View wallet dashboard',credit:'View credit readiness',profile:'Update profile',profileEdit:'Update profile',send:'Initiate payment',confirm:'Initiate payment',

const TXSTATE={send:'—',confirm:'—'};

 f:{},errs:{},attempts:0,pin:'',otp:false,txState:'—',draft:null,sel:null,toast:'',filter:'All',

const fmt=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const R={

kycdone:()=>{const k=S.kyc;const m={verified:['b-ok','check','Identity verified','Your KYC status is verified and a pending wallet has been created. Activate it to start sending money.'],

const TABS={user:[['dashboard','home','Home'],['send','send','Send'],['history','clock','History'],['profile','user','Profile']],analyst:[['monitor','eye','Monitor'],['resolveq','flag','Disputes']]};
function setState(s){S.txState=s}
function render(){
  const r=R[S.screen]();
  if(r.state)setState(r.state);
  const ucName=SCREEN_UC[S.screen];
  $('#app').innerHTML=`<div class="sbar"><span>9:41</span><span>5G ▮▮▮</span></div>
   <div class="hdr">${r.back?`<button class="back" data-act="back" aria-label="Back">${ic('back',18)}</button>`:''}<h1>${r.t}</h1>${r.state?`<span class="chipst">${r.state}</span>`:''}</div>
   <div id="body" data-screen="${S.screen}">${r.body}</div>
   ${r.tabs?`<nav class="tabs">${TABS[r.tabs].map(t=>`<button class="${S.screen===t[0]?'on':''}" data-go="${t[0]}">${ic(t[1],20)}${t[2]}</button>`).join('')}</nav>`:''}
   ${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}`;
  renderSide(ucName);
}
function renderSide(cur){
  const groups={user:'User',partner:'Partner / Agent',analyst:'Risk Analyst'};
  $('#index').innerHTML=`<div class="brandrow"><div class="logo">V</div><div><b>VIChTech Wallet</b><small>Clickable prototype · Sprint 3</small></div></div>
   <h2>Use Case Diagram</h2>${Object.keys(groups).map(g=>`<div class="actor">${groups[g]}</div>${UCS.filter(u=>u[0]===g).map(u=>`<button class="uc ${cur===u[1]?'cur':''}" data-jump="${u[2]}">${u[1]}</button>`).join('')}`).join('')}
   <p class="hint">Tap a use case to open its screen. Actors KYC Provider and VIChTech banking system are external systems shown inside the flows.</p>`;
  const st=S.txState;const on=n=>st===n?'on':'';
  $('#sm').innerHTML=`<h2>Transaction state (Initiate payment)</h2><div class="sm">
   <div class="st ${on('Initiated')}"><b>Initiated</b><span>entry / generateTransactionID()</span></div>
   <div class="comp"><em>PaymentVerification</em><div class="st ${on('Validating')}"><b>Validating</b><span>entry / verify account details · do / fetchWalletBalance()</span></div>
    <div class="st ${on('Authorizing')}"><b>Authorizing</b><span>do / verifyPIN() · [invalid PIN, attempts &lt; 3] / promptRetry()</span></div></div>
   <div class="st ${on('Pending')}"><b>Pending</b><span>entry / updateStatusToPending()</span></div>
   <div class="st ${on('Processing')}"><b>Processing</b><span>do / sendGatewayRequest()</span></div>
   <div class="st good ${on('Completed')}"><b>Completed</b><span>exit / sendPaymentReceipt()</span></div>
   <div class="st fail ${on('Cancelled')}"><b>Cancelled</b><span>[payment declined by bank] / do undoTransaction()</span></div>
   <div class="st fail ${on('Failed')}"><b>Failed</b><span>[wallet inactive or balance &lt; amount] · [3 failed PINs] / lockWallet()</span></div></div>
   <p class="hint">Current state: <b>${st}</b>. Matches the submitted state machine diagram.</p>`;
  $('#ctl').innerHTML=`<h2>Prototype controls</h2><div class="ctl"><p class="hint" style="margin:0">Not part of the app. They let a reviewer trigger each exception path.</p>
   <label>Wallet status<select data-ctl="wallet"><option value="1" ${S.walletActive?'selected':''}>Active</option><option value="0" ${!S.walletActive?'selected':''}>Inactive</option></select></label>
   <label>Bank response<select data-ctl="bank"><option value="approve" ${S.bank==='approve'?'selected':''}>Approves payment</option><option value="decline" ${S.bank==='decline'?'selected':''}>Declines payment</option></select></label>
   <label>KYC outcome<select data-ctl="kyc"><option value="verified" ${S.kyc==='verified'?'selected':''}>Verified</option><option value="review" ${S.kyc==='review'?'selected':''}>Manual review</option><option value="rejected" ${S.kyc==='rejected'?'selected':''}>Rejected</option><option value="unreadable" ${S.kyc==='unreadable'?'selected':''}>Unreadable ID (first upload)</option></select></label></div>`;
}
function go(id,push=true){if(push)S.stack.push(S.screen);S.screen=id;S.errs={};S.toast='';render();const b=$('#body');if(b)b.scrollTop=0;auto()}
function back(){const p=S.stack.pop();if(p)go(p,false)}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';if(!document.hidden)render()},2200)}
function auto(){
  const s=S.screen;
  if(s==='kyc')later(1400,()=>{if(S.kyc==='unreadable')S.kyc='verified';go('kycdone')},s);
  if(s==='validating')later(1300,()=>{const a=S.draft.amount;if(!S.walletActive){S.failMsg=['Wallet inactive','Your wallet is not active, so this payment cannot be sent.'];go('failed')}else if(a>S.balance){S.failMsg=['Insufficient funds','Your balance of '+fmt(S.balance)+' is lower than '+fmt(a)+'.'];go('failed')}else{S.attempts=0;S.pin='';go('pin')}},s);
  if(s==='pending')later(1400,()=>go('processing'),s);
  if(s==='processing')later(1700,()=>{
    if(S.bank==='decline'){S.txs.unshift({id:S.draft.id,payee:S.draft.payee,amount:-S.draft.amount,status:'Cancelled',date:'21 Oct',note:S.draft.note||'—'});go('cancelled')}
    else{S.balance=+(S.balance-S.draft.amount).toFixed(2);S.txs.unshift({id:S.draft.id,payee:S.draft.payee,amount:-S.draft.amount,status:'Completed',date:'21 Oct',note:S.draft.note||'—'});S.queue.push({id:S.draft.id,payee:S.draft.payee,amount:S.draft.amount});S.settleSel[S.draft.id]=1;S.mon.unshift({id:S.draft.id,from:S.profile.name,to:S.draft.payee,amount:S.draft.amount,risk:14,flag:false,note:'Regular peer payment'});go('receipt')}},s);
  if(s==='verifyp')later(1500,()=>{S.partnerStatus='Verified';go('onboardDone')},s);
}
function setRole(r){S.role=r;S.stack=[];go(r==='user'?'dashboard':r==='partner'?'pHome':'monitor',false)}
function jump(id){
  const role=UCS.find(u=>u[2]===id)[0];S.role=role;S.stack=[];S.errs={};S.f={};S.filter='All';
  if(['pin','validating','confirm','pending','processing'].includes(id)||id==='pin'){S.draft={id:'T-10493',payee:'Liam Chen',amount:45,note:'Textbook share'};S.attempts=0;S.pin=''}
  if(id==='dispute1'){S.sel='T-10492'}
  if(id==='activate'){S.walletPending=true}
  if(id==='investigate'||id==='flag'){S.selMon=S.selMon||'T-10477'}
  if(id==='kyc'){}
  go(id,false);
}
/* ---------- actions ---------- */
function act(a,el){
  const V=el.dataset.v;
  switch(a){
  case 'back':back();break;
  case 'login':S.profile.email=($('#lemail')||{}).value||S.profile.email;go('dashboard',false);break;
  case 'logout':go('login',false);break;
  case 'filter':S.filter=V;render();break;
  case 'reg1':if(need(['rname','remail','rphone','rpw'])){go('register2')}else{S.errs.any=1;render()}break;
  case 'upid':if(S.kyc==='unreadable'&&!S.up.id){S.errs.id='We could not read that document. Please upload it again.';S.kyc='verified';S.up.id=false}else{S.up.id=true;S.errs={}}render();break;
  case 'upselfie':S.up.selfie=true;render();break;
  case 'reg2':S.walletPending=S.kyc==='verified';go('kyc');break;
  case 'activate':S.walletPending=false;S.walletActive=true;S.locked=false;toast('Wallet activated');break;
  case 'unlock':S.walletActive=true;S.locked=false;S.attempts=0;toast('Wallet unlocked');break;
  case 'waitlist':S.waitlist=!S.waitlist;render();break;
  case 'editprofile':go('profileEdit');break;
  case 'saveprofile':{S.errs={};const e=($('#pemail')||{}).value||'';if(!(S.f.pname??S.profile.name).trim())S.errs.pname='Name is required';if(!/.+@.+\..+/.test(S.f.pemail??S.profile.email))S.errs.pemail='Enter a valid email address';
    if(Object.keys(S.errs).length){render();break}
    S.profile.name=S.f.pname??S.profile.name;S.profile.email=S.f.pemail??S.profile.email;S.profile.phone=S.f.pphone??S.profile.phone;S.profile.address=S.f.paddr??S.profile.address;S.profile.status='Updated';S.profile.date='21 Oct 2026';S.stack=[];go('profile',false);break}
  case 'payee':S.f.payee=V;render();break;
  case 'review':{if(!need(['payee','amount']))return render();const a=parseFloat(S.f.amount);if(!(a>0)){S.errs.amount='Enter an amount greater than 0';return render()}
    S.draft={id:'T-'+(10493+S.txs.filter(t=>+t.id.slice(2)>10492).length),payee:S.f.payee,amount:a,note:S.f.note||''};go('confirm');break}
  case 'confirm':S.attempts=0;S.pin='';go('validating');break;
  case 'key':if(S.pin.length<4){S.pin+=V;S.errs={};render();if(S.pin.length===4)setTimeout(checkPin,250)}break;
  case 'del':S.pin=S.pin.slice(0,-1);render();break;
  case 'otp':S.otp=true;toast('OTP sent. Demo code: 4829');break;
  case 'startdispute':S.f={};S.dform={};go('dispute2');break;
  case 'pickdsp':S.sel=V;S.f={};go('dispute2');break;
  case 'devid':S.f.devid=!S.f.devid;render();break;
  case 'dreview':{S.errs={};if(!S.f.dreason)S.errs.dreason='Select a reason';if(!(S.f.ddesc||'').trim())S.errs.ddesc='Describe the issue';if(S.f.dreason&&!(S.f.dextra||'').trim())S.errs.dextra='This field is required';
    if(Object.keys(S.errs).length){S.errs.any=1;return render()}
    if(S.disputes.some(d=>d.tx===S.sel)){S.lastDsp=S.disputes.find(d=>d.tx===S.sel);return go('disputeDup')}go('dispute3');break}
  case 'dsubmit':{const t=S.txs.find(x=>x.id===S.sel);S.lastDsp={ref:'DSP-'+(2040+S.disputes.length-2),tx:S.sel,payee:t.payee,reason:S.f.dreason,status:'Open',by:'User',amount:Math.abs(t.amount),desc:S.f.ddesc};S.disputes.unshift(S.lastDsp);S.stack=[];go('dispute4',false);break}
  case 'ob1':{const D={bname:'Campus Café Pty Ltd',breg:'51 824 753 556',bemail:'hello@campuscafe.com.au'};S.errs={};Object.keys(D).forEach(k=>{if(!(S.f[k]??D[k]).trim())S.errs[k]='This field is required'});if(Object.keys(S.errs).length){S.errs.any=1;render()}else{go('onboard2')}break}
  case 'uplic':S.up.lic=true;render();break;case 'upreg':S.up.reg=true;render();break;
  case 'ob2':go('verifyp');break;
  case 'selq':S.settleSel[V]=S.settleSel[V]?0:1;render();break;
  case 'settle1':if(S.queue.some(q=>S.settleSel[q.id]))go('settle2');else toast('Select at least one transaction');break;
  case 'settle2':{const n=S.queue.filter(q=>S.settleSel[q.id]);S.batch={id:'ST-3301',n:n.length,tot:n.reduce((a,q)=>a+q.amount,0)};S.queue=S.queue.filter(q=>!S.settleSel[q.id]);S.settleSel={};S.stack=[];go('settle3',false);break}
  case 'pickmon':S.selMon=V;go('investigate');break;
  case 'clear':toast('Marked as cleared');break;
  case 'flagit':{const m=S.mon.find(x=>x.id===S.selMon);m.flag=true;S.flagCount++;S.lastFlag={id:m.id,reason:S.f.freason||'Unusual amount',inv:'INV-88'+(1+S.flagCount)};S.stack=[];go('flagDone',false);break}
  case 'pickdsp2':S.selDsp=V;go('resolve1');break;
  case 'resolve':{const d=S.disputes.find(x=>x.ref===S.selDsp);d.status='Resolved';d.outcome=S.f.rdec||'Refund the user';go('resolveDone',false);break}
  }
}
function checkPin(){
  const ok=S.pin==='1234'||(S.otp&&S.pin==='4829');
  if(ok){S.errs={};go('pending')}
  else{S.attempts++;S.pin='';
    if(S.attempts>=3){S.walletActive=false;S.locked=true;S.failMsg=['Wallet locked','Too many incorrect PIN attempts. Your wallet is temporarily locked.'];go('failed')}
    else{S.errs.pin='Invalid PIN. '+(3-S.attempts)+' attempt'+(3-S.attempts===1?'':'s')+' left. Please try again.';render()}}
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');if(j){jump(j.dataset.jump);return}
  const el=e.target.closest('[data-act],[data-go]');if(!el)return;
  if(el.dataset.act){act(el.dataset.act,el);return}
  if(el.dataset.sel)S.sel=el.dataset.sel;
  if(el.dataset.dsp){S.f={};go('dispute1');return}
  const tabs=el.closest('.tabs');if(tabs)S.stack=[];
  go(el.dataset.go);
});
document.addEventListener('input',e=>{const t=e.target;if(t.id&&t.closest('#app')){S.f[t.id]=t.value}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ctl){const k=t.dataset.ctl;if(k==='wallet')S.walletActive=t.value==='1';if(k==='bank')S.bank=t.value;if(k==='kyc'){S.kyc=t.value;S.up.id=false}renderSide(SCREEN_UC[S.screen]);return}
  if(t.dataset.live){S.f[t.id]=t.value;render()}
});
window.proto={jump,go,S,render,setRole};
render();
</script>
</body></html>
